services:
  nats:
    image: nats:latest
    container_name: local-nats
    restart: unless-stopped

    ports:
      - "4222:4222"   # NATS client
      - "8222:8222"   # Monitoring

    volumes:
      - ./nats.conf:/etc/nats/nats.conf:ro
      - ./data:/data

    command: ["-c", "/etc/nats/nats.conf"]