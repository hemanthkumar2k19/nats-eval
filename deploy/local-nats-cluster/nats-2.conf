port: 4222
http_port: 8222

server_name: "nats-2"

server_tags: ["stream:primary"]

log_file: "/data/nats.log"
logtime: true

jetstream {
    store_dir: "/data/jetstream"
}

cluster {
    name: "local-nats-cluster"

    listen: "0.0.0.0:6222"

    routes [
        "nats://nats-1:6222"
        "nats://nats-3:6222"
    ]
}